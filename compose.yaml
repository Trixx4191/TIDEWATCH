services:
  tidewatch:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TIDEWATCH_DATA_DIR: /app/state/processed
      TIDEWATCH_RAW_DIR: /app/state/raw
      TIDEWATCH_PACKAGES_DIR: /app/state/packages
      TIDEWATCH_PYTHON: python3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tidewatch-state:/app/state

volumes:
  tidewatch-state: